<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:700}.b{font-size:26px}.s{font-size:21px}.m{fill:#475569}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <path d="M0 130 H1600 M0 785 H1600" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="78" class="t h">Proxyma command flow</text>
  <text x="80" y="112" class="t s m">The left-hand host runs both the harness and proxyma-agent before sending requests to Proxyma.</text>

  <rect x="45" y="205" width="735" height="410" rx="34" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
  <rect x="45" y="205" width="735" height="72" rx="34" fill="#e0e7ff"/><path d="M45 277 H780" stroke="#6366f1" stroke-width="3"/>
  <rect x="92" y="223" width="58" height="36" rx="7" fill="#fff" stroke="#4f46e5" stroke-width="3"/><path d="M105 241 h32" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  <text x="465" y="253" class="t h" text-anchor="middle">Agent machine</text>
  <text x="465" y="300" class="t s m" text-anchor="middle">one host · two cooperating components</text>

  <rect x="95" y="355" width="285" height="175" rx="22" fill="#fff" stroke="#4f46e5" stroke-width="4"/>
  <rect x="135" y="401" width="62" height="50" rx="6" fill="none" stroke="#4338ca" stroke-width="4"/><path d="M150 417 l12 10 -12 10 M168 440 h16" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round"/>
  <text x="270" y="426" class="t b" text-anchor="middle">Agent Harness</text><text x="270" y="468" class="t s m" text-anchor="middle">plans the work</text><text x="270" y="500" class="t s m" text-anchor="middle">instructs the agent</text>
  <rect x="445" y="355" width="285" height="175" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <circle cx="490" cy="426" r="28" fill="#fff" stroke="#0f766e" stroke-width="4"/><path d="M490 411 v30 M475 426 h30" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="426" class="t b" text-anchor="middle">proxyma-agent</text><text x="590" y="468" class="t s m" text-anchor="middle">auth · submit · poll</text><text x="590" y="500" class="t s m" text-anchor="middle">receives results</text>
  <path d="M380 442 H445" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/><text x="412" y="413" class="t s m" text-anchor="middle">instructs</text>

  <rect x="875" y="270" width="390" height="300" rx="28" fill="#fff" stroke="#1d4ed8" stroke-width="5"/><rect x="875" y="270" width="390" height="72" rx="28" fill="#dbeafe"/><path d="M875 342 h390" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1070" y="317" class="t h" text-anchor="middle">Proxyma Server</text><text x="915" y="395" class="t b">authenticate</text><circle cx="1200" cy="387" r="12" fill="#22c55e"/><text x="915" y="445" class="t b">policy check</text><circle cx="1200" cy="437" r="12" fill="#22c55e"/><text x="915" y="495" class="t b">approval if required</text><circle cx="1200" cy="487" r="12" fill="#f59e0b"/><text x="915" y="545" class="t b">execute + audit</text><circle cx="1200" cy="537" r="12" fill="#22c55e"/>
  <rect x="1360" y="350" width="180" height="170" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="4"/><rect x="1400" y="388" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1400" y="427" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1400" y="466" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1450" y="550" class="t b" text-anchor="middle">Target</text>
  <rect x="945" y="35" width="215" height="115" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="4"/><circle cx="995" cy="80" r="18" fill="none" stroke="#b45309" stroke-width="4"/><path d="M963 123 q32-42 64 0" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/><text x="1065" y="88" class="t b" text-anchor="middle">User</text><text x="1065" y="123" class="t b" text-anchor="middle">Approver</text>
  <path d="M730 442 H875" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="802" y="408" class="t s" fill="#1d4ed8" text-anchor="middle">command request</text><path d="M1265 442 H1360" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="1312" y="408" class="t s" fill="#1d4ed8" text-anchor="middle">run command</text><path d="M1360 492 H1265" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/><text x="1312" y="535" class="t s m" text-anchor="middle">result / status</text><path d="M1045 150 V270" fill="none" stroke="#d97706" stroke-width="6" marker-end="url(#amber)"/><path d="M1075 270 V150" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/><text x="1095" y="210" class="t s" fill="#b45309">approve / reject</text>

  <rect x="95" y="670" width="1410" height="90" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="725" class="t b" text-anchor="middle">The Agent machine is the host boundary; Proxyma Server is the policy boundary.</text>
</svg>
