<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="amber-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <marker id="gray-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#0f172a; }
      .small { font-size:24px; }
      .body { font-size:28px; }
      .title { font-size:34px; font-weight:700; }
      .muted { fill:#475569; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <path d="M0 120 H1600 M0 780 H1600" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="75" class="label title">Proxyma command flow</text>
  <text x="80" y="108" class="label small muted">The harness asks the agent to use Proxyma; Proxyma controls execution and approval.</text>

  <rect x="75" y="300" width="290" height="170" rx="22" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
  <rect x="112" y="342" width="62" height="50" rx="6" fill="#fff" stroke="#4338ca" stroke-width="4"/>
  <path d="M127 358 l12 10 -12 10 M145 381 h16" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="370" class="label body" text-anchor="middle">Agent Harness</text>
  <text x="200" y="410" class="label small muted" text-anchor="middle">agent runtime</text>
  <text x="200" y="446" class="label small muted" text-anchor="middle">instructions + reasoning</text>

  <rect x="425" y="300" width="260" height="170" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <circle cx="478" cy="365" r="28" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <path d="M478 350 v30 M463 365 h30" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="565" y="370" class="label body" text-anchor="middle">proxyma-agent</text>
  <text x="555" y="413" class="label small muted" text-anchor="middle">deterministic CLI</text>
  <text x="555" y="447" class="label small muted" text-anchor="middle">auth · submit · poll</text>

  <rect x="790" y="235" width="430" height="315" rx="28" fill="#fff" stroke="#1d4ed8" stroke-width="5"/>
  <rect x="790" y="235" width="430" height="72" rx="28" fill="#dbeafe"/>
  <path d="M790 307 h430" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1005" y="282" class="label title" text-anchor="middle">Proxyma Server</text>
  <text x="835" y="355" class="label body">1  authenticate</text>
  <text x="835" y="405" class="label body">2  policy check</text>
  <text x="835" y="455" class="label body">3  approval if required</text>
  <text x="835" y="505" class="label body">4  execute + audit</text>
  <circle cx="1158" cy="353" r="12" fill="#22c55e"/><circle cx="1158" cy="403" r="12" fill="#22c55e"/><circle cx="1158" cy="453" r="12" fill="#f59e0b"/><circle cx="1158" cy="503" r="12" fill="#22c55e"/>

  <rect x="1315" y="300" width="210" height="170" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="4"/>
  <rect x="1370" y="338" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/>
  <rect x="1370" y="377" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/>
  <rect x="1370" y="416" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/>
  <circle cx="1385" cy="351" r="4" fill="#14b8a6"/><circle cx="1385" cy="390" r="4" fill="#14b8a6"/><circle cx="1385" cy="429" r="4" fill="#14b8a6"/>
  <text x="1418" y="495" class="label body" text-anchor="middle">Target</text>

  <rect x="900" y="35" width="210" height="115" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
  <circle cx="952" cy="82" r="18" fill="none" stroke="#b45309" stroke-width="4"/>
  <path d="M920 124 q32-42 64 0" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <text x="1020" y="90" class="label body" text-anchor="middle">User</text>
  <text x="1020" y="124" class="label body" text-anchor="middle">Approver</text>

  <path d="M365 385 H425" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#gray-arrow)"/>
  <text x="395" y="355" class="label small muted" text-anchor="middle">instructs</text>
  <path d="M685 385 H790" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="738" y="350" class="label small" fill="#1d4ed8" text-anchor="middle">command request</text>
  <path d="M1220 385 H1315" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="1267" y="350" class="label small" fill="#1d4ed8" text-anchor="middle">run command</text>
  <path d="M1315 438 H1220" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray-arrow)"/>
  <text x="1267" y="482" class="label small muted" text-anchor="middle">result / status</text>
  <path d="M1005 150 V235" fill="none" stroke="#d97706" stroke-width="6" marker-end="url(#amber-arrow)"/>
  <path d="M1035 235 V150" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber-arrow)"/>
  <text x="1055" y="198" class="label small" fill="#b45309">approve / reject</text>

  <rect x="90" y="635" width="1420" height="100" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="135" cy="685" r="10" fill="#2563eb"/><text x="160" y="694" class="label small">command flow: request → policy → remote execution → result</text>
  <circle cx="800" cy="685" r="10" fill="#d97706"/><text x="825" y="694" class="label small">human approval: the server can pause until a user approves or rejects</text>
</svg>
