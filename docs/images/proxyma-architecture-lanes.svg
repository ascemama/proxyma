<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <style>
      .t { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#172033; }
      .h { font-size:32px; font-weight:700; } .b { font-size:27px; } .s { font-size:22px; } .m { fill:#64748b; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="70" class="t h">How the pieces work together</text>
  <text x="70" y="105" class="t s m">A command starts with the harness, crosses Proxyma’s policy boundary, and reaches the target only when permitted.</text>
  <rect x="60" y="145" width="1480" height="650" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="60" y="145" width="430" height="650" rx="24" fill="#eef2ff"/>
  <rect x="490" y="145" width="650" height="650" fill="#eff6ff"/>
  <rect x="1140" y="145" width="400" height="650" rx="24" fill="#f1f5f9"/>
  <path d="M490 145 V795 M1140 145 V795" stroke="#cbd5e1" stroke-width="3"/>
  <text x="275" y="205" class="t h" text-anchor="middle">Agent side</text>
  <text x="815" y="205" class="t h" text-anchor="middle">Proxyma</text>
  <text x="1340" y="205" class="t h" text-anchor="middle">Target side</text>

  <rect x="125" y="285" width="300" height="105" rx="18" fill="#fff" stroke="#4f46e5" stroke-width="4"/>
  <path d="M165 322 h48 v38 h-48 z M175 332 l10 9 -10 9 M191 350 h12" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="346" class="t b" text-anchor="middle">Agent Harness</text>
  <text x="310" y="375" class="t s m" text-anchor="middle">plans the work</text>
  <rect x="125" y="510" width="300" height="105" rx="18" fill="#fff" stroke="#0f766e" stroke-width="4"/>
  <circle cx="175" cy="562" r="25" fill="none" stroke="#0f766e" stroke-width="4"/><path d="M175 546 v32 M159 562 h32" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="310" y="556" class="t b" text-anchor="middle">proxyma-client</text>
  <text x="310" y="585" class="t s m" text-anchor="middle">submits and polls</text>
  <path d="M275 390 V510" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#blue)"/>
  <text x="298" y="460" class="t s m">instructs</text>

  <rect x="585" y="285" width="460" height="330" rx="22" fill="#fff" stroke="#1d4ed8" stroke-width="5"/>
  <text x="815" y="340" class="t h" text-anchor="middle">Proxyma Server</text>
  <path d="M625 365 H1005" stroke="#bfdbfe" stroke-width="3"/>
  <text x="650" y="410" class="t b">authenticate</text><circle cx="972" cy="401" r="11" fill="#22c55e"/>
  <text x="650" y="460" class="t b">policy check</text><circle cx="972" cy="451" r="11" fill="#22c55e"/>
  <text x="650" y="510" class="t b">approval if required</text><circle cx="972" cy="501" r="11" fill="#f59e0b"/>
  <text x="650" y="560" class="t b">execute and audit</text><circle cx="972" cy="551" r="11" fill="#22c55e"/>

  <rect x="1230" y="390" width="220" height="150" rx="18" fill="#fff" stroke="#475569" stroke-width="4"/>
  <rect x="1285" y="425" width="110" height="23" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><rect x="1285" y="458" width="110" height="23" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><rect x="1285" y="491" width="110" height="23" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="1340" y="585" class="t b" text-anchor="middle">Target</text>
  <path d="M425 562 H585" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/>
  <text x="505" y="532" class="t s" text-anchor="middle">command request</text>
  <path d="M1045 500 H1230" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/>
  <text x="1137" y="470" class="t s" text-anchor="middle">remote execution</text>
  <path d="M1230 535 H1045" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#blue)"/>
  <text x="1137" y="575" class="t s m" text-anchor="middle">result / status</text>

  <rect x="705" y="690" width="220" height="70" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
  <circle cx="745" cy="724" r="13" fill="none" stroke="#b45309" stroke-width="3"/><path d="M722 750 q23-30 46 0" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="835" y="732" class="t b" text-anchor="middle">User Approver</text>
  <path d="M815 690 V615" fill="none" stroke="#d97706" stroke-width="6" marker-end="url(#amber)"/>
  <path d="M850 615 V690" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/>
  <text x="880" y="658" class="t s" fill="#b45309">approve / reject</text>
  <rect x="90" y="830" width="1420" height="34" rx="17" fill="#dbeafe"/>
  <text x="800" y="854" class="t s" text-anchor="middle">Only the server holds target connection details, applies policy, and records the outcome.</text>
</svg>
