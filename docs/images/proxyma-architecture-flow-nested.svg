<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:700}.b{font-size:26px}.s{font-size:21px}.m{fill:#475569}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/><path d="M0 130 H1600 M0 785 H1600" stroke="#e2e8f0" stroke-width="2"/>
  <text fill="#0f172a" x="80" y="78" class="t h">Proxyma command flow</text><text fill="#475569" x="80" y="112" class="t s m">Two components live inside the same agent machine, while Proxyma remains the controlled gateway to the target.</text>

  <rect x="70" y="210" width="650" height="405" rx="32" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/>
  <text x="395" y="260" class="t h" text-anchor="middle">Agent machine</text><text x="395" y="295" class="t s m" text-anchor="middle">same host</text>
  <rect x="175" y="330" width="440" height="100" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><rect x="175" y="465" width="440" height="100" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <rect x="220" y="358" width="56" height="43" rx="5" fill="#fff" stroke="#4338ca" stroke-width="4"/><path d="M233 372 l10 9 -10 9 M251 389 h15" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round"/><text x="445" y="392" class="t b" text-anchor="middle">Agent Harness</text><text x="445" y="420" class="t s m" text-anchor="middle">agent runtime</text>
  <circle cx="235" cy="515" r="25" fill="#fff" stroke="#0f766e" stroke-width="4"/><path d="M235 500 v30 M220 515 h30" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/><text x="445" y="517" class="t b" text-anchor="middle">proxyma-agent</text><text x="445" y="545" class="t s m" text-anchor="middle">auth · submit · poll</text>
  <path d="M395 430 V465" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/><text x="430" y="453" class="t s m">instructs</text>

  <rect x="815" y="270" width="430" height="305" rx="28" fill="#fff" stroke="#1d4ed8" stroke-width="5"/><rect x="815" y="270" width="430" height="72" rx="28" fill="#dbeafe"/><path d="M815 342 h430" stroke="#1d4ed8" stroke-width="3"/><text x="1030" y="317" class="t h" text-anchor="middle">Proxyma Server</text>
  <text x="860" y="395" class="t b">authenticate</text><circle cx="1180" cy="387" r="12" fill="#22c55e"/><text x="860" y="445" class="t b">policy check</text><circle cx="1180" cy="437" r="12" fill="#22c55e"/><text x="860" y="495" class="t b">approval if required</text><circle cx="1180" cy="487" r="12" fill="#f59e0b"/><text x="860" y="545" class="t b">execute + audit</text><circle cx="1180" cy="537" r="12" fill="#22c55e"/>
  <rect x="1335" y="350" width="180" height="170" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="4"/><rect x="1375" y="388" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1375" y="427" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1375" y="466" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><text x="1425" y="550" class="t b" text-anchor="middle">Target</text>
  <rect x="945" y="35" width="215" height="115" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="4"/><circle cx="995" cy="80" r="18" fill="none" stroke="#b45309" stroke-width="4"/><path d="M963 123 q32-42 64 0" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/><text x="1065" y="88" class="t b" text-anchor="middle">User</text><text x="1065" y="123" class="t b" text-anchor="middle">Approver</text>
  <path d="M720 515 H815" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="767" y="480" class="t s" fill="#1d4ed8" text-anchor="middle">command request</text><path d="M1245 442 H1335" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="1290" y="408" class="t s" fill="#1d4ed8" text-anchor="middle">run command</text><path d="M1335 492 H1245" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/><text x="1290" y="535" class="t s m" text-anchor="middle">result / status</text><path d="M1045 150 V270" fill="none" stroke="#d97706" stroke-width="6" marker-end="url(#amber)"/><path d="M1075 270 V150" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/><text x="1095" y="210" class="t s" fill="#b45309">approve / reject</text>

  <rect x="90" y="675" width="1420" height="85" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><circle cx="135" cy="718" r="10" fill="#6366f1"/><text x="160" y="727" class="t s">Nested boxes show co-location: Agent Harness and proxyma-agent share the Agent machine.</text><circle cx="935" cy="718" r="10" fill="#2563eb"/><text x="960" y="727" class="t s">The server remains outside that host boundary.</text>
</svg>
