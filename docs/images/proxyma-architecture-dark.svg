  <path d="M150 720 H210" stroke="#60a5fa" stroke-width="6" marker-end="url(#b)"/><text fill="#e2e8f0" x="235" y="728" class="t s">command flow</text>
  <path d="M610 720 H670" stroke="#fbbf24" stroke-width="6" marker-end="url(#a)"/><text fill="#e2e8f0" x="695" y="728" class="t s">human approval</text>
  <text fill="#94a3b8" x="1060" y="728" class="t s muted">blue = execution path · amber = approval path</text>
