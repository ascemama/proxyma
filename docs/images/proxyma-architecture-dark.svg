  <rect x="1380" y="342" width="105" height="25" rx="4" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="1380" y="378" width="105" height="25" rx="4" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="1380" y="414" width="105" height="25" rx="4" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text fill="#e2e8f0" x="1432" y="510" class="t b" text-anchor="middle">Target</text>

