  <text fill="#e2e8f0" x="820" y="360" class="t b">auth</text><text fill="#e2e8f0" x="820" y="420" class="t b">policy</text><text fill="#e2e8f0" x="820" y="480" class="t b">approval</text><text fill="#e2e8f0" x="820" y="540" class="t b">audit</text>
  <circle cx="1145" cy="352" r="13" fill="#34d399"/><circle cx="1145" cy="412" r="13" fill="#34d399"/><circle cx="1145" cy="472" r="13" fill="#fbbf24"/><circle cx="1145" cy="532" r="13" fill="#34d399"/>
  <text fill="#94a3b8" x="985" y="638" class="t s muted" text-anchor="middle">policy-enforcing proxy</text>

