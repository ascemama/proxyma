  <text x="1270" y="350" class="t s" fill="#93c5fd" text-anchor="middle">run command</text>
  <path d="M1330 440 H1210" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#b)"/>
  <text fill="#94a3b8" x="1270" y="490" class="t s muted" text-anchor="middle">result / status</text>
