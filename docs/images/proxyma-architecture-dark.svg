    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#fbbf24"/></marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#e2e8f0; } .t { fill:#e2e8f0; } .h { font-size:34px; font-weight:700; } .b { font-size:28px; } .s { font-size:22px; } .muted { fill:#94a3b8; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#0b1220"/>
  <path d="M0 150 H1600 M0 760 H1600" stroke="#1e293b" stroke-width="2"/>
