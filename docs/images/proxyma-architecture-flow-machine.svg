<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <marker id="gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/></marker>
    <style>
      .t { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#0f172a; } .h { font-size:34px; font-weight:700; } .b { font-size:27px; } .s { font-size:22px; } .m { fill:#475569; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <path d="M0 130 H1600 M0 785 H1600" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="78" class="t h">Proxyma command flow</text>
  <text x="80" y="112" class="t s m">The harness and proxyma-client run together on one machine; the server controls access to the target.</text>

  <rect x="55" y="220" width="720" height="385" rx="30" fill="#eef2ff" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 9"/>
  <rect x="85" y="190" width="275" height="58" rx="18" fill="#4f46e5"/>
  <text x="222" y="228" class="t b" fill="#ffffff" text-anchor="middle">Agent machine</text>
  <text x="390" y="227" class="t s m">same host</text>

  <rect x="105" y="320" width="270" height="175" rx="22" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/>
  <rect x="142" y="365" width="62" height="50" rx="6" fill="#fff" stroke="#4338ca" stroke-width="4"/>
  <path d="M157 381 l12 10 -12 10 M175 404 h16" fill="none" stroke="#4338ca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="255" y="392" class="t b" text-anchor="middle">Agent Harness</text>
  <text x="255" y="433" class="t s m" text-anchor="middle">agent runtime</text>
  <text x="255" y="468" class="t s m" text-anchor="middle">instructions + reasoning</text>

  <rect x="455" y="320" width="270" height="175" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
  <circle cx="505" cy="390" r="28" fill="#fff" stroke="#0f766e" stroke-width="4"/><path d="M505 375 v30 M490 390 h30" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="605" y="392" class="t b" text-anchor="middle">proxyma-client</text>
  <text x="590" y="433" class="t s m" text-anchor="middle">deterministic CLI</text>
  <text x="590" y="468" class="t s m" text-anchor="middle">auth · submit · poll</text>
  <path d="M375 408 H455" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#gray)"/>
  <text x="415" y="380" class="t s m" text-anchor="middle">instructs</text>

  <rect x="845" y="265" width="410" height="310" rx="28" fill="#fff" stroke="#1d4ed8" stroke-width="5"/>
  <rect x="845" y="265" width="410" height="72" rx="28" fill="#dbeafe"/><path d="M845 337 h410" stroke="#1d4ed8" stroke-width="3"/>
  <text x="1050" y="312" class="t h" text-anchor="middle">Proxyma Server</text>
  <text x="890" y="385" class="t b">authenticate</text><circle cx="1190" cy="377" r="12" fill="#22c55e"/>
  <text x="890" y="435" class="t b">policy check</text><circle cx="1190" cy="427" r="12" fill="#22c55e"/>
  <text x="890" y="485" class="t b">approval if required</text><circle cx="1190" cy="477" r="12" fill="#f59e0b"/>
  <text x="890" y="535" class="t b">execute + audit</text><circle cx="1190" cy="527" r="12" fill="#22c55e"/>

  <rect x="1350" y="320" width="195" height="175" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="4"/>
  <rect x="1398" y="358" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1398" y="397" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="1398" y="436" width="100" height="27" rx="5" fill="#fff" stroke="#475569" stroke-width="3"/>
  <circle cx="1413" cy="371" r="4" fill="#14b8a6"/><circle cx="1413" cy="410" r="4" fill="#14b8a6"/><circle cx="1413" cy="449" r="4" fill="#14b8a6"/>
  <text x="1447" y="525" class="t b" text-anchor="middle">Target</text>

  <rect x="930" y="35" width="215" height="115" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="4"/>
  <circle cx="980" cy="80" r="18" fill="none" stroke="#b45309" stroke-width="4"/><path d="M948 123 q32-42 64 0" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <text x="1050" y="88" class="t b" text-anchor="middle">User</text><text x="1050" y="123" class="t b" text-anchor="middle">Approver</text>

  <path d="M725 408 H845" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="785" y="375" class="t s" fill="#1d4ed8" text-anchor="middle">command request</text>
  <path d="M1255 408 H1350" fill="none" stroke="#2563eb" stroke-width="7" marker-end="url(#blue)"/><text x="1302" y="375" class="t s" fill="#1d4ed8" text-anchor="middle">run command</text>
  <path d="M1350 458 H1255" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#gray)"/><text x="1302" y="500" class="t s m" text-anchor="middle">result / status</text>
  <path d="M1030 150 V265" fill="none" stroke="#d97706" stroke-width="6" marker-end="url(#amber)"/><path d="M1060 265 V150" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amber)"/><text x="1080" y="210" class="t s" fill="#b45309">approve / reject</text>

  <rect x="90" y="660" width="1420" height="95" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="135" cy="707" r="10" fill="#6366f1"/><text x="160" y="716" class="t s">Agent machine = Agent Harness + proxyma-client on the same host</text>
  <circle cx="800" cy="707" r="10" fill="#2563eb"/><text x="825" y="716" class="t s">Proxyma Server = policy, execution, audit, and user approval</text>
</svg>
