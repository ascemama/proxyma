services:
  Proxyma:
    image: ${PROXYMA_IMAGE:-ghcr.io/ascemama/proxyma:latest}
    ports:
      - "${PROXYMA_BIND_ADDRESS:-0.0.0.0}:${PROXYMA_HOST_PORT:-8080}:8080"
    environment:
      - PROXYMA_LISTEN=0.0.0.0:8080
    volumes:
      - ./proxyma-config:/etc/proxyma
      - ./proxyma-data:/var/lib/proxyma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --spider https://127.0.0.1:8080/ || wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
