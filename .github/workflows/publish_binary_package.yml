name: Publish binary package
run-name: ${{ github.event_name == 'push' && format('Publish precompiled Linux binary release {0}', github.ref_name) || 'Validate precompiled Linux binary release changes' }}

on:
  pull_request:
    paths:
      - ".github/workflows/publish_binary_package.yml"
      - "LICENSE"
      - "cmd/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/*.sh"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: bash scripts/container-tags.sh example.invalid/proxyma "$GITHUB_REF_NAME" >/dev/null

      - name: Test Go packages
        run: go test ./...

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Test precompiled downloader
        run: bash scripts/test-install-linux.sh

      - name: Test Docker release downloader and package
        run: bash scripts/test-install-docker.sh

      - name: Test deployment endpoint scripts
        run: bash scripts/test-deployment-endpoint.sh

  frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-frontend
          path: internal/web/dist

      - name: Build Linux binaries
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          PROXYMA_SKIP_FRONTEND_BUILD: "1"
          PROXYMA_VERSION: ${{ env.RELEASE_VERSION }}
          PROXYMA_COMMIT: ${{ github.sha }}
        run: bash scripts/build-release.sh

      - name: Package release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-linux-release.sh \
            "${{ matrix.arch }}" \
            "$RELEASE_VERSION" \
            "${{ github.sha }}" \
            release-assets

      - name: Smoke-test AMD64 server metadata
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          output="$(./dist/Proxyma-linux-amd64 --version)"
          grep -F "${RELEASE_VERSION#v}" <<<"$output"
          grep -F "${GITHUB_SHA:0:7}" <<<"$output"

      - name: Inspect release archive
        shell: bash
        run: |
          test "$(tar -tzf "release-assets/proxyma_linux_${{ matrix.arch }}.tar.gz" | grep -c '^proxyma/dist/[^/]\+$')" -eq 2
          tar -tzf "release-assets/proxyma_linux_${{ matrix.arch }}.tar.gz" | grep -Fx 'proxyma/scripts/install-linux-release.sh'
          tar -tzf "release-assets/proxyma_linux_${{ matrix.arch }}.tar.gz" | grep -Fx 'proxyma/scripts/uninstall-linux-release.sh'

      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/proxyma_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker-package:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Package Docker deployment bundle
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-docker-release.sh \
            "$RELEASE_VERSION" \
            "${{ github.sha }}" \
            release-assets

      - name: Inspect Docker deployment bundle
        shell: bash
        run: |
          tar -tzf release-assets/proxyma_docker.tar.gz | grep -Fx 'proxyma/RELEASE'
          tar -tzf release-assets/proxyma_docker.tar.gz | grep -Fx 'proxyma/docker-compose.example.yml'
          tar -tzf release-assets/proxyma_docker.tar.gz | grep -Fx 'proxyma/scripts/install-proxyma-docker.sh'
          tar -tzf release-assets/proxyma_docker.tar.gz | grep -Fx 'proxyma/scripts/uninstall-proxyma-docker.sh'

      - name: Upload Docker deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-release
          path: release-assets/proxyma_docker.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - docker-package
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download Linux archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true

      - name: Download Docker deployment bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-release
          path: release-assets

      - name: Prepare checksums and release installers
        shell: bash
        run: |
          install -m 0755 scripts/install-proxyma.sh release-assets/install-proxyma.sh
          install -m 0755 scripts/download-proxyma-docker.sh release-assets/install-proxyma-docker.sh
          (
            cd release-assets
            sha256sum \
              proxyma_linux_amd64.tar.gz \
              proxyma_linux_arm64.tar.gz \
              proxyma_docker.tar.gz \
              install-proxyma.sh \
              install-proxyma-docker.sh \
              | sort -k2 >SHA256SUMS
          )

      - name: Attest release assets
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

          release_flags=(--verify-tag --generate-notes --title "Proxyma $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            release-assets/proxyma_linux_amd64.tar.gz \
            release-assets/proxyma_linux_arm64.tar.gz \
            release-assets/proxyma_docker.tar.gz \
            release-assets/install-proxyma.sh \
            release-assets/install-proxyma-docker.sh \
            release-assets/SHA256SUMS
