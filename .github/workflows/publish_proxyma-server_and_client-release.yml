name: Publish Proxyma Server and Client release
run-name: ${{ github.event_name == 'push' && format('Publish precompiled Linux binary release {0}', github.ref_name) || 'Validate precompiled Linux binary release changes' }}

on:
  pull_request:
    paths:
      - ".github/workflows/publish_proxyma-server_and_client-release.yml"
      - "README.md"
      - "LICENSE"
      - "cmd/**"
      - "frontend/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/*.sh"
      - "scripts/*.ps1"
      - "harness/**"
      - "docs/proxyma-client-installation-release.md"
      - "docs/proxyma-client-installation-source.md"
      - "docs/release-testing.md"
      - "docs/release-testing.md"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: bash scripts/container-tags.sh example.invalid/proxyma "$GITHUB_REF_NAME" >/dev/null

      - name: Test Go packages
        run: go test ./...

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate vm-workflow documentation
        run: bash scripts/test-vm-workflow-documentation.sh

      - name: Validate harness v2 assets
        shell: pwsh
        run: ./harness/tests/validate-harness-assets.ps1

      - name: Test sanitized client harness package
        run: bash scripts/test-package-client-harness.sh

      - name: Test precompiled downloader
        run: bash scripts/test-install-proxyma-server-linux.sh

      - name: Test Docker release downloader and package
        run: bash scripts/test-install-proxyma-server-docker.sh

      - name: Test deployment endpoint scripts
        run: bash scripts/test-proxyma-server-deployment-endpoints.sh

  frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded-frontend
          path: internal/web/dist

      - name: Build Linux binaries
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          PROXYMA_SKIP_FRONTEND_BUILD: "1"
          PROXYMA_VERSION: ${{ env.RELEASE_VERSION }}
          PROXYMA_COMMIT: ${{ github.sha }}
        run: bash scripts/build-server-release.sh

      - name: Package release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-server-release-linux.sh \
            "${{ matrix.arch }}" \
            "$RELEASE_VERSION" \
            "${{ github.sha }}" \
            release-assets

      - name: Smoke-test AMD64 server metadata
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          output="$(./dist/Proxyma-linux-amd64 --version)"
          grep -F "${RELEASE_VERSION#v}" <<<"$output"
          grep -F "${GITHUB_SHA:0:7}" <<<"$output"

      - name: Inspect release archive
        shell: bash
        run: |
          test "$(tar -tzf "release-assets/proxyma-server-linux-${{ matrix.arch }}.tar.gz" | grep -c '^proxyma/dist/[^/]\+$')" -eq 2
          tar -tzf "release-assets/proxyma-server-linux-${{ matrix.arch }}.tar.gz" | grep -Fx 'proxyma/scripts/install-proxyma-server-linux-release.sh'
          tar -tzf "release-assets/proxyma-server-linux-${{ matrix.arch }}.tar.gz" | grep -Fx 'proxyma/scripts/uninstall-proxyma-server-linux-release.sh'

      - name: Upload Linux archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/proxyma-server-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  client-platform-test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test client CLI and atomic state
        run: go test ./internal/clientcli ./internal/store
      - name: Test POSIX client release installer
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/test-install-client.sh
      - name: Test Windows client release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install-client.ps1
      - name: Validate PowerShell assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = @()
          foreach ($file in @(
            './scripts/build-client-release.ps1',
            './scripts/build-vm-workflow-release.ps1',
            './scripts/install-proxyma-client.ps1',
            './scripts/test-install-client.ps1',
            './scripts/test-client-release.ps1',
            './harness/tests/claude-code-smoke.ps1'
          )) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          }
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

  client-harness-package:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Package sanitized client harness and installers
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-client-harness.sh \
            "$RELEASE_VERSION" \
            "${{ github.sha }}" \
            release-assets
          install -m 0755 scripts/install-proxyma-client.sh release-assets/install-proxyma-client.sh
          install -m 0644 scripts/install-proxyma-client.ps1 release-assets/install-proxyma-client.ps1

      - name: Inspect client harness release assets
        shell: bash
        run: |
          tar -tzf release-assets/proxyma-client-harness.tar.gz | grep -Fx 'harness/RELEASE'
          tar -tzf release-assets/proxyma-client-harness.tar.gz | grep -Fx 'harness/proxyma-client.json'
          tar -tzf release-assets/proxyma-client-harness.tar.gz | grep -Fx 'harness/.agents/skills/proxyma-harness/SKILL.md'
          ! tar -tzf release-assets/proxyma-client-harness.tar.gz | grep -F 'df9ec8bb-1a22-4181-a7c8-126ad553221d.json'

      - name: Upload client harness and installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxyma-client-installation
          path: |
            release-assets/proxyma-client-harness.tar.gz
            release-assets/install-proxyma-client.sh
            release-assets/install-proxyma-client.ps1
          if-no-files-found: error
          retention-days: 1

  client-build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            asset: proxyma-client-linux-amd64
          - os: linux
            arch: arm64
            asset: proxyma-client-linux-arm64
          - os: windows
            arch: amd64
            asset: proxyma-client-windows-amd64.exe
          - os: windows
            arch: arm64
            asset: proxyma-client-windows-arm64.exe
          - os: darwin
            arch: amd64
            asset: proxyma-client-darwin-amd64
          - os: darwin
            arch: arm64
            asset: proxyma-client-darwin-arm64
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build standalone client CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          OUT_DIR: release-assets
          PROXYMA_VERSION: ${{ env.RELEASE_VERSION }}
          PROXYMA_COMMIT: ${{ github.sha }}
        run: bash scripts/build-client-release.sh
      - name: Inspect binary metadata
        run: go version -m "release-assets/${{ matrix.asset }}"
      - name: Upload standalone client CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  vm-workflow-build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            asset: vm-workflow-linux-amd64
          - os: linux
            arch: arm64
            asset: vm-workflow-linux-arm64
          - os: windows
            arch: amd64
            asset: vm-workflow-windows-amd64.exe
          - os: windows
            arch: arm64
            asset: vm-workflow-windows-arm64.exe
          - os: darwin
            arch: amd64
            asset: vm-workflow-darwin-amd64
          - os: darwin
            arch: arm64
            asset: vm-workflow-darwin-arm64
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build standalone workflow CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          OUT_DIR: release-assets
          PROXYMA_VERSION: ${{ env.RELEASE_VERSION }}
          PROXYMA_COMMIT: ${{ github.sha }}
        run: bash scripts/build-vm-workflow-release.sh
      - name: Inspect binary metadata
        run: go version -m "release-assets/${{ matrix.asset }}"
      - name: Upload standalone workflow CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-workflow-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  docker-package:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-ci.{0}', github.run_number) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Package Docker deployment bundle
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-server-release-docker.sh \
            "$RELEASE_VERSION" \
            "${{ github.sha }}" \
            release-assets

      - name: Inspect Docker deployment bundle
        shell: bash
        run: |
          tar -tzf release-assets/proxyma-server-docker.tar.gz | grep -Fx 'proxyma/RELEASE'
          tar -tzf release-assets/proxyma-server-docker.tar.gz | grep -Fx 'proxyma/docker-compose.example.yml'
          tar -tzf release-assets/proxyma-server-docker.tar.gz | grep -Fx 'proxyma/scripts/install-proxyma-server-docker.sh'
          tar -tzf release-assets/proxyma-server-docker.tar.gz | grep -Fx 'proxyma/scripts/uninstall-proxyma-server-docker.sh'

      - name: Upload Docker deployment bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-release
          path: release-assets/proxyma-server-docker.tar.gz
          if-no-files-found: error
          retention-days: 1

  release-assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - docker-package
      - client-build
      - vm-workflow-build
      - client-harness-package
      - client-platform-test
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true

      - name: Download Docker deployment bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-release
          path: release-assets

      - name: Download standalone client CLIs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true

      - name: Download standalone vulnerability-management CLIs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-workflow-*
          path: release-assets
          merge-multiple: true

      - name: Download client harness and installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proxyma-client-installation
          path: release-assets

      - name: Prepare checksums and release installers
        shell: bash
        run: |
          install -m 0755 scripts/install-proxyma-server-linux.sh release-assets/install-proxyma-server-linux.sh
          install -m 0755 scripts/download-proxyma-server-docker.sh release-assets/install-proxyma-server-docker.sh
          (
            cd release-assets
            sha256sum \
              proxyma-server-linux-amd64.tar.gz \
              proxyma-server-linux-arm64.tar.gz \
              proxyma-server-docker.tar.gz \
              install-proxyma-server-linux.sh \
              install-proxyma-server-docker.sh \
              install-proxyma-client.sh \
              install-proxyma-client.ps1 \
              proxyma-client-harness.tar.gz \
              proxyma-client-linux-* \
              proxyma-client-windows-* \
              proxyma-client-darwin-* \
              vm-workflow-linux-* \
              vm-workflow-windows-* \
              vm-workflow-darwin-* \
              | sort -k2 >SHA256SUMS
          )

      - name: Verify complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            proxyma-server-linux-amd64.tar.gz
            proxyma-server-linux-arm64.tar.gz
            proxyma-server-docker.tar.gz
            install-proxyma-server-linux.sh
            install-proxyma-server-docker.sh
            install-proxyma-client.sh
            install-proxyma-client.ps1
            proxyma-client-harness.tar.gz
            proxyma-client-linux-amd64
            proxyma-client-linux-arm64
            proxyma-client-windows-amd64.exe
            proxyma-client-windows-arm64.exe
            proxyma-client-darwin-amd64
            proxyma-client-darwin-arm64
            vm-workflow-linux-amd64
            vm-workflow-linux-arm64
            vm-workflow-windows-amd64.exe
            vm-workflow-windows-arm64.exe
            vm-workflow-darwin-amd64
            vm-workflow-darwin-arm64
          )
          for asset in "${expected_assets[@]}"; do
            test -f "release-assets/$asset"
          done
          test "$(wc -l <release-assets/SHA256SUMS)" -eq "${#expected_assets[@]}"
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Attest release assets
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload assembled release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  prepublish-client-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-assets
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download assembled release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Test staged client release on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging_root="$(mktemp -d)"
          trap 'rm -rf "$staging_root"' EXIT
          mkdir -p "$staging_root/releases/download/$GITHUB_REF_NAME"
          cp release-assets/* "$staging_root/releases/download/$GITHUB_REF_NAME/"
          bash scripts/test-client-release.sh \
            "$GITHUB_REF_NAME" \
            "file://$staging_root"

      - name: Test staged client release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stagingRoot = Join-Path $env:RUNNER_TEMP ("proxyma-client-release-" + [Guid]::NewGuid().ToString("N"))
          $releaseDir = Join-Path $stagingRoot ("releases\download\" + $env:GITHUB_REF_NAME)
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item -Path ((Resolve-Path .\release-assets).Path + '\*') -Destination $releaseDir -Recurse
          $releaseBaseUrl = ([Uri]::new($stagingRoot)).AbsoluteUri.TrimEnd('/')
          try {
            & .\scripts\test-client-release.ps1 `
              -Version $env:GITHUB_REF_NAME `
              -ReleaseBaseUrl $releaseBaseUrl
          }
          finally {
            if (Test-Path -LiteralPath $stagingRoot) { Remove-Item -LiteralPath $stagingRoot -Recurse -Force }
          }

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-assets
      - prepublish-client-release
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref_name, '-') && 'release-prerelease' || 'production-release' }}
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download assembled release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

          release_flags=(--verify-tag --generate-notes --title "Proxyma $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${release_flags[@]}" \
            release-assets/proxyma-server-linux-amd64.tar.gz \
            release-assets/proxyma-server-linux-arm64.tar.gz \
            release-assets/proxyma-server-docker.tar.gz \
            release-assets/install-proxyma-server-linux.sh \
            release-assets/install-proxyma-server-docker.sh \
            release-assets/install-proxyma-client.sh \
            release-assets/install-proxyma-client.ps1 \
            release-assets/proxyma-client-harness.tar.gz \
            release-assets/proxyma-client-linux-* \
            release-assets/proxyma-client-windows-* \
            release-assets/proxyma-client-darwin-* \
            release-assets/SHA256SUMS

  postpublish-client-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Test published client release on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/test-client-release.sh \
            "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY"

      - name: Test published client release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\scripts\test-client-release.ps1 `
            -Version $env:GITHUB_REF_NAME `
            -ReleaseBaseUrl "https://github.com/$env:GITHUB_REPOSITORY"
