name: Security scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          -w /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose .

  govulncheck:
    name: Scan Go dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

  npm-audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  trivy:
    name: Scan source and container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build container for scanning
        run: docker build --tag proxyma:security-scan .

      - name: Scan source filesystem
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          -w /repo
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --no-progress /repo

      - name: Export container image
        run: docker save proxyma:security-scan --output "$RUNNER_TEMP/proxyma-security-scan.tar"

      - name: Scan container image
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/proxyma-security-scan.tar:/scan/proxyma.tar:ro"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --input /scan/proxyma.tar --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --no-progress
